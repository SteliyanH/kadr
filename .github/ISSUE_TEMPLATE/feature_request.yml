name: Feature request
description: Something kadr cannot express today.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The composition or the outcome, not the API. Knowing the goal often
        turns up a way to express it that already exists — and when it doesn't,
        it produces a better API than a feature described in the abstract.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if you have one.
  - type: textarea
    id: shape
    attributes:
      label: What the API might look like
      description: Optional, and a sketch is fine.
      render: swift
