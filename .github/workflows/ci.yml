name: CI

# `develop` and `main` require the `test` check (branch protection). A workflow
# that only ran on `workflow_dispatch` could never produce it: manually
# dispatched runs are not reported as a PR status, so every pull request sat
# BLOCKED and the only way to land anything was an admin override. Restored on
# `pull_request` so the required check exists where protection actually needs
# it — on the PR's head commit.
#
# Runner minutes are shared, so the trigger set stays deliberately narrow:
#
#   - `pull_request` only, NOT `push`. A post-merge push run would re-test code
#     the PR already tested. Where merge commits differ from PR heads it is
#     `strict: true` in branch protection (require branches up to date) that
#     catches it, not a second full run.
#   - `concurrency` cancels superseded runs, so iterating on a PR costs one run
#     rather than one per push.
#   - `workflow_dispatch` stays for manual runs on a branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15

    # The suite takes ~30s locally and ~3-4 min on a runner. Without a cap, a
    # hung process runs to GitHub's 360-minute default — six hours of macOS
    # runner time, billed at 10x the Linux rate, for a job that should be over
    # in minutes. That is not hypothetical: a run on 2026-08-17 sat for 33
    # minutes after its tests had already finished, and had to be cancelled by
    # hand. 15 is generous against the real 3-4.
    timeout-minutes: 15

    env:
      # Export itself works here — crop, overlays, transitions, speed and
      # multi-overlay exports all pass. What fails is narrower: 15 tests that
      # need a *second* decode pass, either because the feature pre-renders an
      # intermediate file (filters via FilterProcessor, reverse via
      # ReverseProcessor) or because it decodes a second asset (the audio tests
      # and the sample.mp3 fixture). Those fail with -11821 "Cannot Decode" and
      # then wedge the test process — the runner logs `Terminate orphan process
      # (swiftpm-testing)`, which is what `timeout-minutes` above now caps.
      #
      # They pass on hardware, so they are skipped rather than deleted. Full
      # diagnosis in Tests/KadrTests/TestEnvironment.swift.
      #
      # This leaves filters, audio mixing and reverse unverified by CI. Real
      # gap, deliberately taken; tracked in the issues, not just here.
      KADR_SKIP_REENCODE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned, not `latest-stable`. The suite's behaviour depends on
          # AVFoundation, so the toolchain is part of the test environment: a
          # green run months ago and a red run today should differ because the
          # code changed, not because the image moved under us. 26.3 is what
          # the last green run used.
          xcode-version: '26.3'
      - run: swift test
